name: Historical Backtest (Preview DB)

on:
  workflow_dispatch:
  push:
    branches:
      - experiments/market-markov-clv
    paths:
      - ".github/workflows/historical-backtest.yml"
      - "experiments/**"
      - "requirements.txt"

permissions:
  contents: read

concurrency:
  group: historical-backtest-preview
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Preview secret
        id: preview
        shell: bash
        env:
          PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
        run: |
          if [ -z "$PREVIEW_DATABASE_URL" ]; then
            echo "::warning::Repository secret PREVIEW_DATABASE_URL is not configured. Add the isolated Neon Preview connection string, then re-run this workflow."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run read-only historical experiments
        if: steps.preview.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
        run: |
          python experiments/run_historical.py > historical-report.json
          python -m json.tool historical-report.json

      - name: Upload historical report
        if: steps.preview.outputs.configured == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: historical-backtest-report
          path: historical-report.json
          if-no-files-found: error
          retention-days: 30
