name: Tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main, "feature/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Check Cito live API connection
        if: github.event_name == 'push'
        env:
          TENNIS_DATA_API_KEY: ${{ secrets.TENNIS_DATA_API_KEY }}
        run: |
          if [ -n "$TENNIS_DATA_API_KEY" ]; then
            python -m scripts.check_cito_live
          else
            echo "Cito secret is not configured; skipping live connectivity check."
          fi
