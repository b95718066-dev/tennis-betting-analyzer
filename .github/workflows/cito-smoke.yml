name: Cito Live API Smoke Test

on:
  workflow_dispatch:

jobs:
  cito-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Cito live API connection
        env:
          TENNIS_DATA_API_KEY: ${{ secrets.TENNIS_DATA_API_KEY }}
        run: |
          if [ -z "$TENNIS_DATA_API_KEY" ]; then
            echo "::error::TENNIS_DATA_API_KEY secret is missing."
            exit 1
          fi
          python -m scripts.check_cito_live
